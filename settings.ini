[obs]
; Leave this address unchanged when OBS and the scene switcher run on the same PC.
; OBS WebSocket 5.x normally uses port 4455.
address=ws://127.0.0.1:4455

; In OBS: Tools -> WebSocket Server Settings -> Show Connect Info -> Copy Password
; Replace the placeholder below with the exact OBS WebSocket password.
password=PASTE_OBS_WEBSOCKET_PASSWORD_HERE

; Replace these placeholders with the exact OBS scene names.
; Scene names are case-sensitive and space-sensitive.
scene_menu=PASTE_EXACT_OBS_MENU_SCENE_NAME_HERE
scene_gameplay=PASTE_EXACT_OBS_GAMEPLAY_SCENE_NAME_HERE

[clonehero]
; Enter the folder that contains currentsong.txt, not the path to the file itself.
; Typical example: C:\Users\WindowsUserName\Documents\Clone Hero
; OneDrive example: C:\Users\WindowsUserName\OneDrive\Documents\Clone Hero
; Portable installs normally use the PlayerData folder inside the Clone Hero folder.
folder=PASTE_CLONE_HERO_FOLDER_PATH_HERE
